# Paramètres versionnés pour Kedro
ingestion:
  start_date: "2000-01-01"
  target_ticker: "NEE"
  max_missing_pct: 0.10
  tickers:
    - ETR
    - NEE
    - D
    - DUK
    - SO
    - EXC
    - AEP
    - XEL
    - FE
    - ED
    - PEG
    - PPL
    - FTS
    - EIX
    - AEE
    - ES
    - PNW
    - CMS

features:
  lag_period: 5
  correlation_threshold: 0.60
  sma_windows: [5, 14, 30, 50, 200]
  ema_windows: [5, 14, 30, 50, 200]
  rsi_windows: [5, 14, 30, 50, 200]
  volume_sma_window: 5

training:
  test_size: 0.20
  random_state: 42
  mlflow_experiment_name: "energystock-ai"
  random_forest:
    n_estimators: 200
    max_depth: 10
